<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="吴昊天的个人主页，北京大学数学科学学院本科生。">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <title>吴昊天 | Haotian Wu</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('haotian-theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      } catch (_) {}
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --background: #ffffff;
      --foreground: #24282c;
      --muted: #68717a;
      --header: #e8f3fb;
      --line: #e9edf0;
      --avatar: #f3f5f7;
      --link: #255d82;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --background: #191c21;
      --foreground: #e5e9ed;
      --muted: #a4adb6;
      --header: #222e3b;
      --line: #343b43;
      --avatar: #29313a;
      --link: #a2cdec;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --background: #191c21;
        --foreground: #e5e9ed;
        --muted: #a4adb6;
        --header: #222e3b;
        --line: #343b43;
        --avatar: #29313a;
        --link: #a2cdec;
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 17px;
      line-height: 1.85;
    }
    a { color: var(--link); text-underline-offset: 4px; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--link); outline-offset: 5px; }
    .skip-link { position: absolute; top: -80px; left: 16px; z-index: 2; padding: 8px 16px; background: var(--background); }
    .skip-link:focus { top: 8px; }
    .site-header { background: var(--header); }
    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      min-height: 64px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .brand { color: var(--foreground); font-size: 21px; font-weight: 650; text-decoration: none; letter-spacing: .04em; }
    .navigation { display: flex; align-items: center; gap: 26px; font-size: 15px; }
    .navigation a { color: var(--foreground); text-decoration: none; }
    .navigation a:hover { text-decoration: underline; }
    .theme-toggle { width: 36px; height: 36px; padding: 6px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--foreground); cursor: pointer; }
    .theme-toggle:hover { background: var(--avatar); }
    .theme-toggle svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .theme-toggle[hidden] { display: none; }
    main { width: min(100% - 64px, 790px); margin: 0 auto; flex: 1; padding: 80px 0 112px; }
    .profile { display: flex; align-items: center; gap: 26px; }
    .avatar {
      width: 92px;
      height: 92px;
      flex: 0 0 92px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--avatar);
      font-family: "Songti SC", "Noto Serif CJK SC", SimSun, serif;
      font-size: 38px;
      color: var(--foreground);
    }
    h1 { margin: 0; font-size: 34px; line-height: 1.35; font-weight: 650; letter-spacing: .04em; }
    .english-name { margin: 4px 0 9px; color: var(--muted); font-size: 17px; letter-spacing: .025em; }
    .profile-link { font-size: 15px; }
    .about { margin-top: 68px; padding-top: 30px; border-top: 1px solid var(--line); scroll-margin-top: 30px; }
    h2 { margin: 0 0 19px; font-size: 22px; font-weight: 600; }
    .about p { margin: 0; }
    .about .english-bio { margin-top: 14px; font-size: 16px; color: var(--muted); line-height: 1.8; }
    footer { width: min(100% - 64px, 790px); margin: 0 auto; padding: 22px 0 27px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
    @media (max-width: 520px) {
      .header-inner { padding: 0 22px; min-height: 60px; gap: 15px; }
      .navigation { gap: 17px; font-size: 14px; }
      .brand { font-size: 19px; }
      main { width: calc(100% - 44px); padding: 56px 0 86px; }
      .profile { gap: 20px; }
      .avatar { width: 74px; height: 74px; flex-basis: 74px; font-size: 32px; }
      h1 { font-size: 29px; }
      .english-name { font-size: 15px; }
      .about { margin-top: 48px; padding-top: 26px; }
      h2 { font-size: 20px; }
      footer { width: calc(100% - 44px); }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">跳转到正文</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="吴昊天的主页">吴昊天</a>
      <nav class="navigation" aria-label="主导航">
        <a href="#about">关于</a>
        <a href="https://github.com/hajimi-wu">GitHub</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换颜色模式" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 13.1A8.6 8.6 0 0 1 10.9 3.6 8.6 8.6 0 1 0 20.4 13.1Z"/></svg>
        </button>
      </nav>
    </div>
  </header>
  <main id="main">
    <section class="profile" aria-labelledby="name">
      <div class="avatar" aria-hidden="true">吴</div>
      <div>
        <h1 id="name">吴昊天</h1>
        <p class="english-name" lang="en">Haotian Wu</p>
        <a class="profile-link" href="https://github.com/hajimi-wu">GitHub · hajimi-wu</a>
      </div>
    </section>
    <section class="about" id="about" aria-labelledby="about-title">
      <h2 id="about-title">关于我</h2>
      <p>我目前就读于北京大学数学科学学院，是一名本科生。</p>
      <p class="english-bio" lang="en">I am an undergraduate student at the School of Mathematical Sciences, Peking University.</p>
    </section>
  </main>
  <footer>© 2026 吴昊天</footer>
  <script>
    (() => {
      const button = document.getElementById('theme-toggle');
      const root = document.documentElement;
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
      const currentTheme = () => root.dataset.theme || (systemTheme.matches ? 'dark' : 'light');
      const updateLabel = () => {
        const dark = currentTheme() === 'dark';
        button.setAttribute('aria-pressed', String(dark));
        button.setAttribute('aria-label', dark ? '切换到浅色模式' : '切换到深色模式');
      };
      button.hidden = false;
      updateLabel();
      button.addEventListener('click', () => {
        const nextTheme = currentTheme() === 'dark' ? 'light' : 'dark';
        root.dataset.theme = nextTheme;
        try { localStorage.setItem('haotian-theme', nextTheme); } catch (_) {}
        updateLabel();
      });
      systemTheme.addEventListener('change', updateLabel);
    })();
  </script>
</body>
</html>
